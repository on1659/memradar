    const metadata = {"DeepDiver":["심해 잠수부","Deep Diver","코드의 깊은 곳까지 파고들어 진짜 원인을 찾아내는 타입."],"CodeAppraiser":["코드 감별사","Code Appraiser","빠르게 코드를 읽고 핵심을 짚어내는 타입."],"Librarian":["도서관 사서","Librarian","넓은 범위를 꼼꼼히 살피며 전체 그림을 그리는 타입."],"TrendHunter":["트렌드 헌터","Trend Hunter","새로운 기술을 빠르게 훑어보고 적용하는 타입."],"MasterSmith":["장인 대장장이","Master Smith","한 프로젝트에 몰두해 완성도 높은 결과물을 만드는 타입."],"LightningFixer":["번개 해결사","Lightning Fixer","문제가 보이면 바로 해치우는 타입."],"AllroundBuilder":["만능 빌더","All-round Builder","이것도 만들고 저것도 만드는 플랫스택 에너지 타입."],"ChaosCreator":["카오스 크리에이터","Chaos Creator","동시다발 실험 속에서 결국 결과를 뽑는 타입."],"NightOwl":["새벽 올빼미","Night Owl","깊은 밤 집중이 올라가고 어두운 터미널이 편한 타입."],"EarlyBird":["아침 스타터","Early Bird","하루 초반부터 가볍게 흐름을 열어가는 타입."],"MorningWarrior":["오전 전사","Morning Warrior","오전 집중력으로 작업을 밀도 있게 처리하는 타입."],"AfternoonWarrior":["오후 전사","Afternoon Warrior","오후 루틴 속에서 작업량이 안정적으로 올라오는 타입."],"EveningCoder":["저녁 코더","Evening Coder","저녁에 집중이 살아나고 코드 리듬이 붙는 타입."],"MoonlightCoder":["달빛 코더","Moonlight Coder","밤 늦게 차분히 코드를 다듬는 타입."],"Feature":["풀스택 기획자","Feature Planner","새 기능 구현, 컴포넌트 추가, API 연결 요청이 많을 때."],"Debug":["버그 헌터","Bug Hunter","에러 원인 찾기, 깨진 동작 수정, 경고 해결 요청이 많을 때."],"Refactor":["리팩터링 전문가","Refactoring Expert","구조 정리, 가독성 개선, 코드 정돈 요청이 많을 때."],"Review":["코드 분석가","Code Analyst","코드 설명, 분석, 검토, 이해를 돕는 요청이 많을 때."],"Writing":["AI 작가","AI Writer","문서 작성, 요약, 번역, README나 리포트 정리 요청이 많을 때."],"Design":["아트 디렉터","Art Director","UI/UX, 스타일, CSS, 레이아웃, 반응형 조정 요청이 많을 때."],"Devops":["배포 마스터","Deploy Master","배포, 빌드, 환경 변수, CI/CD, 서버 설정 요청이 많을 때."],"Data":["데이터 엔지니어","Data Engineer","데이터 처리, 쿼리, JSON/CSV, 스키마 관련 요청이 많을 때."],"Test":["QA 엔지니어","QA Engineer","테스트 작성, 검증 자동화, e2e/unit/spec 관련 요청이 많을 때."],"Read":["파일 읽기","Read","문서를 열어보고 필요한 정보를 확인하는 도구."],"Edit":["파일 수정","Edit","기존 파일의 내용을 찾아 바꾸고 정리하는 도구."],"Write":["파일 작성","Write","새 파일을 만들거나 내용을 추가해 넣는 도구."],"Bash":["명령 실행","Bash","터미널 명령으로 빌드, 테스트, 검색을 실행하는 도구."],"Grep":["텍스트 검색","Grep","코드베이스에서 문자열과 패턴을 빠르게 찾는 도구."],"Glob":["파일 패턴 검색","Glob","파일 이름과 경로 패턴으로 필요한 파일을 찾는 도구."],"Agent":["에이전트 호출","Agent","작업을 나눠 병렬로 처리하거나 보조 조사를 맡기는 도구."],"Web":["웹 액세스","WebSearch/WebFetch","웹 검색과 페이지 확인으로 외부 정보를 가져오는 도구."],"Wrench":["기본 도구","default","분류되지 않은 일반 도구 호출을 표시하는 기본 표식."],"Rank1":["1위 도구","rank 1","가장 많이 사용한 도구를 강조하는 메달 표식."],"BrandMark":["브랜드 마크","brandMark","Memradar 정체성을 표시하는 작은 별형 마크."],"EmptySessions":["빈 세션","emptySessions","가져온 세션이 없을 때 보여주는 빈 상태 아이콘."],"Warning":["경고","warning","오류, 주의, 중단 같은 상태를 알리는 아이콘."],"ToolGlyph":["도구 글리프","Tool Glyph","세션과 내보내기 화면에서 도구 호출을 표시하는 시스템 표식."]}
    let selected = groups[0][1][0]
    let size = 48
    let groupFilter = 'All'
    function escapeHtml(value){return String(value).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
    function svg(shape, px, extra){return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 24 24" fill="none" aria-hidden="true" '+(extra||'')+'>'+shapes[shape]+'</svg>'}
    function iconRecord(item, group){const key=item[0], label=item[1], shape=item[2]; const meta=metadata[shape]||[label,label,'']; return {key,label,shape,group,kr:meta[0],en:meta[1],desc:meta[2]}}
    function allIcons(){return groups.flatMap(function(group){return group[1].map(function(item){return iconRecord(item,group[0])})})}
    function matches(icon, query){const hay=(icon.group+' '+icon.key+' '+icon.label+' '+icon.kr+' '+icon.en+' '+icon.desc).toLowerCase(); return hay.includes(query.toLowerCase()) && (groupFilter==='All'||groupFilter===icon.group)}
    function renderCard(icon){const sampleHtml=sizes.map(function(s){return '<span class="sample">'+svg(icon.shape,s)+'<span>'+s+'</span></span>'}).join(''); const selectedClass=icon.shape===selected[2]?' selected':''; return '<article class="card'+selectedClass+'" style="--group:'+groupColor[icon.group]+'" data-shape="'+icon.shape+'" tabindex="0"><div class="card-main"><div class="icon-tile">'+svg(icon.shape,48)+'</div><div><div class="title-row"><h3 class="kr">'+icon.kr+'</h3><span class="key">'+icon.key+'</span></div><p class="en">'+icon.en+'</p><p class="desc">'+icon.desc+'</p></div></div><div class="samples"><span class="group-label">'+icon.group+'</span>'+sampleHtml+'</div></article>'}
    function selectedGroupName(){for(const group of groups){if(group[1].some(function(item){return item[2]===selected[2]})) return group[0]} return 'Personality'}
    function renderInspector(){const icon=iconRecord(selected,selectedGroupName()); document.getElementById('inspector').innerHTML='<span class="pill">'+icon.group+'</span><h3>'+icon.kr+'</h3><p class="en">'+icon.en+' / '+icon.key+'</p><p class="desc" style="display:block;min-height:0;-webkit-line-clamp:unset">'+icon.desc+'</p><div class="preview-panes"><div class="preview-pane dark">'+svg(icon.shape,size)+'</div><div class="preview-pane">'+svg(icon.shape,size)+'</div></div><div class="specs"><div class="spec"><span>Size</span><strong>'+size+'px</strong></div><div class="spec"><span>Style</span><strong>Color</strong></div><div class="spec"><span>Shape</span><strong>'+icon.shape+'</strong></div></div><pre class="code">'+escapeHtml(shapes[icon.shape])+'</pre>'}
    function renderFilters(){const total=allIcons().length; const chips=['<button class="chip'+(groupFilter==='All'?' active':'')+'" data-group="All">All · '+total+'</button>']; for(const group of groups){chips.push('<button class="chip'+(groupFilter===group[0]?' active':'')+'" data-group="'+group[0]+'">'+group[0]+' · '+group[1].length+'</button>')} document.getElementById('groupFilters').innerHTML=chips.join('')}
    function render(){const query=document.getElementById('search').value.trim(); const visibleGroups=groups.map(function(group){return [group[0],group[1].map(function(item){return iconRecord(item,group[0])}).filter(function(icon){return matches(icon,query)})]}).filter(function(group){return group[1].length}); const totalVisible=visibleGroups.reduce(function(sum,group){return sum+group[1].length},0); document.body.classList.toggle('is-empty',totalVisible===0); document.getElementById('visibleCount').textContent=totalVisible+' icons visible'; document.getElementById('root').innerHTML=visibleGroups.map(function(group){return '<section style="--group:'+groupColor[group[0]]+'"><div class="section-head"><h2 class="section-title"><span class="bar"></span>'+group[0]+'</h2><span class="section-count">'+group[1].length+' icons</span></div><div class="grid">'+group[1].map(renderCard).join('')+'</div></section>'}).join(''); renderInspector(); renderFilters()}
    document.getElementById('heroMark').innerHTML=svg('BrandMark',70)
    document.getElementById('search').addEventListener('input',render)
    document.querySelector('.toolbar .chips').addEventListener('click',function(event){const button=event.target.closest('[data-size]'); if(!button)return; size=Number(button.dataset.size); document.querySelectorAll('[data-size]').forEach(function(btn){btn.classList.toggle('active',btn===button)}); renderInspector()})
    document.getElementById('groupFilters').addEventListener('click',function(event){const button=event.target.closest('[data-group]'); if(!button)return; groupFilter=button.dataset.group; render()})
    document.getElementById('root').addEventListener('click',function(event){const card=event.target.closest('[data-shape]'); if(!card)return; const record=allIcons().find(function(icon){return icon.shape===card.dataset.shape}); if(record)selected=[record.key,record.label,record.shape]; render()})
    render()
  </script>
